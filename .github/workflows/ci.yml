name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .
      - name: Unit tests (offline)
        run: python -m pytest tests/ -q
      - name: Smoke — offline fixture lint
        run: |
          hf-hub-lint --fixture hf_hub_lint/data/fixtures/fixture_model.json | grep -q "Score:"
          hf-hub-lint --fixture hf_hub_lint/data/fixtures/fixture_dataset.json --strict; test $? -eq 1
          hf-hub-lint --fixture hf_hub_lint/data/fixtures/fixture_model.json --format json | grep -q '"score"'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff lint
        run: |
          pip install ruff
          ruff check hf_hub_lint tests scripts --output-format=github